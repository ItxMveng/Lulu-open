<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0369A1">
<title>Hors connexion | LULU-OPEN</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f7fb;color:#1B3A5B;text-align:center;padding:24px}
  .card{max-width:380px}
  .logo{width:72px;height:72px;border-radius:18px;background:#1B3A5B;color:#F97316;font-size:44px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
  h1{font-size:1.4rem;margin:0 0 8px}
  p{color:#4a5b6e;line-height:1.5;margin:0 0 20px}
  button{background:#0369A1;color:#fff;border:0;border-radius:999px;padding:12px 28px;font-size:1rem;font-weight:600;cursor:pointer}
  button:focus-visible{outline:3px solid #F97316;outline-offset:3px}
</style>
</head>
<body>
<div class="card">
  <div class="logo" aria-hidden="true">L</div>
  <h1>Vous êtes hors connexion</h1>
  <p>LULU-OPEN a besoin d'internet pour afficher les offres et vos candidatures. Reconnectez-vous puis réessayez.</p>
  <button type="button" onclick="location.reload()">Réessayer</button>
</div>
</body>
</html>
