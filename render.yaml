services:
  - type: web
    name: lulu-open
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /robots.txt
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: LULU-OPEN
      - key: APP_LOCALE
        value: fr_FR
      # À définir après création : https://<nom>.onrender.com
      - key: APP_URL
        sync: false
      - key: APP_KEY
        generateValue: true
      - key: DEFAULT_CURRENCY
        value: XOF
      # Base MySQL managée externe (ex: Clever Cloud, Aiven, PlanetScale…)
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_CHARSET
        value: utf8mb4
      # IA (clé Mistral)
      - key: AI_PROVIDER
        value: mistral
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: mistral-small-latest
      # Emails (SMTP réel : Brevo, Mailgun, Gmail SMTP…)
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: LULU-OPEN
      # Informations légales de l'éditeur (mentions légales / RGPD) — À RENSEIGNER
      - key: LEGAL_EDITOR_NAME
        sync: false   # dénomination / nom de l'éditeur
      - key: LEGAL_EDITOR_STATUS
        sync: false   # forme juridique (SARL, auto-entrepreneur, association…)
      - key: LEGAL_EDITOR_ADDRESS
        sync: false   # adresse du siège
      - key: LEGAL_EDITOR_REG
        sync: false   # RCS / SIRET / immatriculation
      - key: LEGAL_PUBLICATION_DIRECTOR
        sync: false   # directeur de la publication
      - key: LEGAL_COUNTRY
        sync: false   # pays / droit applicable
      - key: LEGAL_DPO_EMAIL
        sync: false   # email dédié données (optionnel, défaut = MAIL_FROM_ADDRESS)
      # Stockage objet persistant des fichiers (CV, photos) — Cloudflare R2.
      # Sans ces variables, les fichiers vont sur le disque local (éphémère).
      - key: R2_ENDPOINT
        sync: false   # https://<accountid>.r2.cloudflarestorage.com
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
